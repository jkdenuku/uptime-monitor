{% extends "base.html" %}
{% block title %}Add Monitor — PulseWatch{% endblock %}
{% block content %}
<div style="max-width:560px; margin:0 auto;">
  <div class="page-header">
    <h1>Add Monitor</h1>
    <p>Start monitoring a URL in seconds.</p>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="post">
        <div class="form-group">
          <label>Display Name</label>
          <input type="text" name="name" placeholder="My Website" required autofocus>
        </div>
        <div class="form-group">
          <label>URL to Monitor</label>
          <input type="text" name="url" placeholder="https://example.com" required>
        </div>
        <div class="form-group">
          <label>Alert Email <span style="color:var(--muted); font-size:0.75rem; text-transform:none; letter-spacing:0;">(optional — override default)</span></label>
          <input type="email" name="notify_email" placeholder="alerts@example.com">
        </div>
        <div style="display:flex; gap:0.75rem; margin-top:1.75rem;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Add Monitor</button>
          <a href="/" class="btn btn-ghost" style="flex:1; justify-content:center;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
