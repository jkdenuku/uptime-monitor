<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}PulseWatch{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c0f;
    --surface:   #111418;
    --surface2:  #191d24;
    --border:    #242932;
    --accent:    #00e5a0;
    --accent2:   #0066ff;
    --danger:    #ff3b5c;
    --warn:      #ffb800;
    --text:      #e8edf5;
    --muted:     #5a6578;
    --mono:      'Space Mono', monospace;
    --sans:      'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }
  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAV ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,12,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 1.5rem; height: 56px;
  }
  .nav-logo {
    font-family: var(--sans);
    font-weight: 800; font-size: 1.1rem; letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .nav-logo .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.6; transform: scale(1.3); }
  }
  .nav-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.45rem 1rem; border-radius: 6px;
    font-family: var(--sans); font-size: 0.85rem; font-weight: 600;
    cursor: pointer; border: none; text-decoration: none;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent); color: #000;
  }
  .btn-primary:hover { background: #00ffb3; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,229,160,0.3); }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-danger { background: rgba(255,59,92,0.15); color: var(--danger); border: 1px solid rgba(255,59,92,0.3); }
  .btn-danger:hover { background: rgba(255,59,92,0.25); }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; }

  /* ── LAYOUT ── */
  main { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 2rem; }

  /* ── FLASH ── */
  .flash { padding: 0.75rem 1.25rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; font-family: var(--mono); }
  .flash-success { background: rgba(0,229,160,0.1); color: var(--accent); border: 1px solid rgba(0,229,160,0.3); }
  .flash-error   { background: rgba(255,59,92,0.1); color: var(--danger); border: 1px solid rgba(255,59,92,0.3); }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .card-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-body { padding: 1.5rem; }

  /* ── FORMS ── */
  .form-group { margin-bottom: 1.25rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  input[type=text], input[type=url], input[type=email] {
    width: 100%; padding: 0.7rem 1rem;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 0.9rem;
    transition: border-color 0.15s;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,160,0.1); }

  /* ── STATUS BADGE ── */
  .badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    padding: 0.2rem 0.65rem; border-radius: 20px;
    font-family: var(--mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
  }
  .badge-up      { background: rgba(0,229,160,0.12); color: var(--accent); border: 1px solid rgba(0,229,160,0.25); }
  .badge-down    { background: rgba(255,59,92,0.12);  color: var(--danger); border: 1px solid rgba(255,59,92,0.25); }
  .badge-unknown { background: rgba(90,101,120,0.2);  color: var(--muted); border: 1px solid var(--border); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge-up .badge-dot { animation: pulse 1.5s ease-in-out infinite; }

  /* ── TABLE ── */
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 0.85rem 1rem; border-bottom: 1px solid rgba(36,41,50,0.5); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }

  /* ── STAT CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }
  .stat-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  .stat-value { font-family: var(--mono); font-size: 2rem; font-weight: 700; line-height: 1; }
  .stat-value.green { color: var(--accent); }
  .stat-value.red   { color: var(--danger); }
  .stat-value.blue  { color: var(--accent2); }

  /* ── UPTIME BAR ── */
  .uptime-bar-wrap { display: flex; gap: 2px; height: 28px; align-items: stretch; }
  .uptime-bar-wrap span {
    flex: 1; border-radius: 3px; min-width: 3px;
    transition: opacity 0.2s;
  }
  .uptime-bar-wrap span:hover { opacity: 0.7; }

  /* ── PAGE HEADER ── */
  .page-header { margin-bottom: 2rem; }
  .page-header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.25rem; }
  .page-header p  { color: var(--muted); font-size: 0.9rem; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
  .empty h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }
  .empty p  { font-size: 0.9rem; margin-bottom: 1.5rem; }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    main { padding: 1rem; }
    nav  { padding: 0 1rem; }
    .stat-value { font-size: 1.5rem; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-logo"><span class="dot"></span>PulseWatch</a>
  <span class="nav-spacer"></span>
  <a href="/settings" style="color:var(--muted); font-size:0.85rem; text-decoration:none; margin-right:0.5rem;">Settings</a>
  <a href="/monitor/add" class="btn btn-primary">+ Add Monitor</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
