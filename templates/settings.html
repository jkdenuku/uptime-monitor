{% extends "base.html" %}
{% block title %}Settings — PulseWatch{% endblock %}
{% block content %}
<div style="max-width:560px; margin:0 auto;">
  <div class="page-header">
    <h1>Settings</h1>
    <p>Configure email alerts and global defaults.</p>
  </div>
  <div class="card">
    <div class="card-header">
      <span style="font-weight:700; font-size:0.9rem;">📧 Email Notifications</span>
    </div>
    <div class="card-body">
      <form method="post">
        <div class="form-group">
          <label>SMTP Host</label>
          <input type="text" name="smtp_host" placeholder="smtp.gmail.com" value="{{ cfg.get('smtp_host','') }}">
        </div>
        <div class="form-group">
          <label>SMTP Port</label>
          <input type="text" name="smtp_port" placeholder="587" value="{{ cfg.get('smtp_port','587') }}">
        </div>
        <div class="form-group">
          <label>SMTP User (your email)</label>
          <input type="email" name="smtp_user" placeholder="you@gmail.com" value="{{ cfg.get('smtp_user','') }}">
        </div>
        <div class="form-group">
          <label>SMTP Password</label>
          <input type="password" name="smtp_pass" placeholder="app password" value="{{ cfg.get('smtp_pass','') }}">
        </div>
        <div class="form-group">
          <label>Notify Email</label>
          <input type="email" name="notify_email" placeholder="alerts@example.com" value="{{ cfg.get('notify_email','') }}">
        </div>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>
    </div>
  </div>
  <p style="color:var(--muted); font-size:0.8rem; margin-top:1rem;">
    💡 Gmail users: use an App Password (requires 2-step verification).
  </p>
</div>
{% endblock %}
